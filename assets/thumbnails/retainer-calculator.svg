<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Retainer Calculator">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191410"/>
      <stop offset="0.55" stop-color="#131316"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#FF6A1F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- faint grid -->
  <g stroke="#2C2C33" stroke-width="1" opacity="0.35">
    <line x1="0" y1="230" x2="1600" y2="230"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="670" x2="1600" y2="670"/>
  </g>

  <!-- split donut: expense / tax / you keep -->
  <g transform="translate(1230,450)">
    <circle r="180" fill="none" stroke="#2C2C33" stroke-width="46"/>
    <!-- segments via stroke-dasharray on a 2*pi*r = 1131 circumference -->
    <circle r="180" fill="none" stroke="#8C8C95" stroke-width="46"
            stroke-dasharray="600 531" transform="rotate(-90)"/>
    <circle r="180" fill="none" stroke="#B4B4BC" stroke-width="46"
            stroke-dasharray="160 971" stroke-dashoffset="-600" transform="rotate(-90)"/>
    <circle r="180" fill="none" stroke="#FF6A1F" stroke-width="46"
            stroke-dasharray="371 760" stroke-dashoffset="-760" transform="rotate(-90)"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="96" fill="#F7F7F9">&#8377;</text>
  </g>

  <!-- brand mark -->
  <g transform="translate(120,120)">
    <rect width="72" height="72" rx="18" fill="#FF6A1F"/>
    <text x="36" y="52" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="46" fill="#0A0A0B">d</text>
  </g>

  <!-- labels -->
  <text x="120" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="7" fill="#B4B4BC">DESIGN ASYLUM · CALCULATOR</text>
  <text x="116" y="670" font-family="Arial Black, Impact, sans-serif" font-size="120" fill="#F7F7F9" letter-spacing="1">RETAINER</text>
  <text x="120" y="770" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" fill="#FF6A1F">Calculator</text>
</svg>
