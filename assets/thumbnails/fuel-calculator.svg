<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Fuel Calculator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191410"/>
      <stop offset="0.55" stop-color="#131316"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#FF6A1F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6A1F"/>
      <stop offset="1" stop-color="#FFB066"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#2C2C33" stroke-width="1" opacity="0.35">
    <line x1="0" y1="230" x2="1600" y2="230"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="670" x2="1600" y2="670"/>
  </g>

  <!-- ascending spend bars -->
  <g>
    <rect x="980"  y="600" width="90" height="140" rx="14" fill="#2C2C33"/>
    <rect x="1110" y="520" width="90" height="220" rx="14" fill="#3a2c22"/>
    <rect x="1240" y="410" width="90" height="330" rx="14" fill="url(#bar)" opacity="0.85"/>
    <rect x="1370" y="280" width="90" height="460" rx="14" fill="url(#bar)"/>
  </g>

  <!-- growth arrow -->
  <g stroke="#FFB066" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M1000 690 L1150 560 L1285 470 L1410 320"/>
    <path d="M1360 320 L1412 316 L1416 368"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(120,120)">
    <rect width="72" height="72" rx="18" fill="#FF6A1F"/>
    <text x="36" y="52" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="46" fill="#0A0A0B">d</text>
  </g>

  <!-- labels -->
  <text x="120" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="7" fill="#B4B4BC">DESIGN ASYLUM · CALCULATOR</text>
  <text x="116" y="670" font-family="Arial Black, Impact, sans-serif" font-size="120" fill="#F7F7F9" letter-spacing="1">FUEL</text>
  <text x="120" y="770" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" fill="#FF6A1F">Calculator</text>
</svg>
