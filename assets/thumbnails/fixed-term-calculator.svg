<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Fixed-Term Project Calculator">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191410"/>
      <stop offset="0.55" stop-color="#131316"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glow5" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#FF6A1F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg5)"/>
  <rect width="1600" height="900" fill="url(#glow5)"/>

  <!-- faint grid -->
  <g stroke="#2C2C33" stroke-width="1" opacity="0.35">
    <line x1="0" y1="230" x2="1600" y2="230"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="670" x2="1600" y2="670"/>
  </g>

  <!-- ten month blocks: salary / expenses / you save stacked per month -->
  <g transform="translate(930,240)">
    <!-- months 1-6 active -->
    <g>
      <rect x="0"   y="0" width="46" height="420" rx="8" fill="#2C2C33"/>
      <rect x="0"   y="170" width="46" height="250" rx="8" fill="#8C8C95"/>
      <rect x="0"   y="120" width="46" height="46" rx="8" fill="#B4B4BC"/>
      <rect x="0"   y="40" width="46" height="76" rx="8" fill="#FF6A1F"/>

      <rect x="62"  y="0" width="46" height="420" rx="8" fill="#2C2C33"/>
      <rect x="62"  y="170" width="46" height="250" rx="8" fill="#8C8C95"/>
      <rect x="62"  y="120" width="46" height="46" rx="8" fill="#B4B4BC"/>
      <rect x="62"  y="40" width="46" height="76" rx="8" fill="#FF6A1F"/>

      <rect x="124" y="0" width="46" height="420" rx="8" fill="#2C2C33"/>
      <rect x="124" y="170" width="46" height="250" rx="8" fill="#8C8C95"/>
      <rect x="124" y="120" width="46" height="46" rx="8" fill="#B4B4BC"/>
      <rect x="124" y="40" width="46" height="76" rx="8" fill="#FF6A1F"/>

      <rect x="186" y="0" width="46" height="420" rx="8" fill="#2C2C33"/>
      <rect x="186" y="170" width="46" height="250" rx="8" fill="#8C8C95"/>
      <rect x="186" y="120" width="46" height="46" rx="8" fill="#B4B4BC"/>
      <rect x="186" y="40" width="46" height="76" rx="8" fill="#FF6A1F"/>

      <rect x="248" y="0" width="46" height="420" rx="8" fill="#2C2C33"/>
      <rect x="248" y="170" width="46" height="250" rx="8" fill="#8C8C95"/>
      <rect x="248" y="120" width="46" height="46" rx="8" fill="#B4B4BC"/>
      <rect x="248" y="40" width="46" height="76" rx="8" fill="#FF6A1F"/>

      <rect x="310" y="0" width="46" height="420" rx="8" fill="#2C2C33"/>
      <rect x="310" y="170" width="46" height="250" rx="8" fill="#8C8C95"/>
      <rect x="310" y="120" width="46" height="46" rx="8" fill="#B4B4BC"/>
      <rect x="310" y="40" width="46" height="76" rx="8" fill="#FF6A1F"/>
    </g>
    <!-- months 7-10 inactive -->
    <g fill="#2C2C33" opacity="0.55">
      <rect x="372" y="0" width="46" height="420" rx="8"/>
      <rect x="434" y="0" width="46" height="420" rx="8"/>
      <rect x="496" y="0" width="46" height="420" rx="8"/>
      <rect x="558" y="0" width="46" height="420" rx="8"/>
    </g>
    <!-- slider -->
    <rect x="0" y="468" width="604" height="8" rx="4" fill="#2C2C33"/>
    <rect x="0" y="468" width="333" height="8" rx="4" fill="#FF6A1F"/>
    <circle cx="333" cy="472" r="17" fill="#F7F7F9" stroke="#0C0C0E" stroke-width="5"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(120,120)">
    <rect width="72" height="72" rx="18" fill="#FF6A1F"/>
    <text x="36" y="52" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="46" fill="#0A0A0B">d</text>
  </g>

  <!-- labels -->
  <text x="120" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="7" fill="#B4B4BC">DESIGN ASYLUM · CALCULATOR</text>
  <text x="116" y="670" font-family="Arial Black, Impact, sans-serif" font-size="120" fill="#F7F7F9" letter-spacing="1">FIXED-TERM</text>
  <text x="120" y="770" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" fill="#FF6A1F">Project Calculator</text>
</svg>
