<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Floor Price Calculator">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191410"/>
      <stop offset="0.55" stop-color="#131316"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glowF" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#FF6A1F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barF" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6A1F"/>
      <stop offset="1" stop-color="#FFB066"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgF)"/>
  <rect width="1600" height="900" fill="url(#glowF)"/>

  <g stroke="#2C2C33" stroke-width="1" opacity="0.35">
    <line x1="0" y1="230" x2="1600" y2="230"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="670" x2="1600" y2="670"/>
  </g>

  <!-- descending bars resting on a "floor" line -->
  <g>
    <rect x="980"  y="360" width="86" height="330" rx="12" fill="#2C2C33"/>
    <rect x="1092" y="430" width="86" height="260" rx="12" fill="#3a2c22"/>
    <rect x="1204" y="500" width="86" height="190" rx="12" fill="url(#barF)" opacity="0.85"/>
    <rect x="1316" y="560" width="86" height="130" rx="12" fill="url(#barF)"/>
  </g>
  <!-- the floor line -->
  <line x1="950" y1="700" x2="1440" y2="700" stroke="#FF6A1F" stroke-width="6" stroke-linecap="round"/>
  <text x="950" y="742" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#FFB066">FLOOR</text>

  <!-- brand mark -->
  <g transform="translate(120,120)">
    <rect width="72" height="72" rx="18" fill="#FF6A1F"/>
    <text x="36" y="52" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="46" fill="#0A0A0B">d</text>
  </g>

  <text x="120" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="7" fill="#B4B4BC">DESIGN ASYLUM · CALCULATOR</text>
  <text x="116" y="670" font-family="Arial Black, Impact, sans-serif" font-size="104" fill="#F7F7F9" letter-spacing="1">FLOOR PRICE</text>
  <text x="120" y="770" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" fill="#FF6A1F">Calculator</text>
</svg>
