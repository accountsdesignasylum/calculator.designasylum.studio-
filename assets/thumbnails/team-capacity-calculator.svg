<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Team Capacity Calculator">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191410"/>
      <stop offset="0.55" stop-color="#131316"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glowT" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#FF6A1F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgT)"/>
  <rect width="1600" height="900" fill="url(#glowT)"/>

  <g stroke="#2C2C33" stroke-width="1" opacity="0.35">
    <line x1="0" y1="230" x2="1600" y2="230"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="670" x2="1600" y2="670"/>
  </g>

  <!-- per-person capacity bars (tracks + fills), one overbooked -->
  <g>
    <rect x="900" y="330" width="470" height="26" rx="13" fill="#2C2C33"/>
    <rect x="900" y="330" width="300" height="26" rx="13" fill="#B8B2A6"/>

    <rect x="900" y="404" width="470" height="26" rx="13" fill="#2C2C33"/>
    <rect x="900" y="404" width="390" height="26" rx="13" fill="#FFB066"/>

    <rect x="900" y="478" width="470" height="26" rx="13" fill="#2C2C33"/>
    <rect x="900" y="478" width="470" height="26" rx="13" fill="#FF6A1F"/>
    <rect x="1370" y="478" width="40" height="26" rx="13" fill="#FF6A1F" opacity="0.55"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(120,120)">
    <rect width="72" height="72" rx="18" fill="#FF6A1F"/>
    <text x="36" y="52" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="46" fill="#0A0A0B">d</text>
  </g>

  <text x="120" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="7" fill="#B4B4BC">DESIGN ASYLUM · CALCULATOR</text>
  <text x="116" y="670" font-family="Arial Black, Impact, sans-serif" font-size="98" fill="#F7F7F9" letter-spacing="1">TEAM CAPACITY</text>
  <text x="120" y="770" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" fill="#FF6A1F">Calculator</text>
</svg>
